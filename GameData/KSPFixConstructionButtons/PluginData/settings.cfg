// Read once when KSP starts: quit KSP, edit this file, start KSP again.

// Makes the snap button of the EVA construction mode show the step actually in use. On stock, its icon shows "fine"
// when the mode opens, and again after each pause, while the parts move and turn by steps.
snapIcon = True

// Makes the coordinate space button of the EVA construction mode read, translated, the space the move or rotate
// gizmo actually uses. On stock, it reads "Absolute", in English in every language, until the first click, even
// when the rotate gizmo turns the part in Local space.
coordSpaceLabel = True

// How much the mod writes to KSP.log: Error, Warning, Info or Debug. At Debug, one line each time the mod sets a
// button.
logLevel = Info
